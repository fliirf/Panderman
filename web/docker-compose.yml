services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: panderman
      POSTGRES_PASSWORD: panderman
      POSTGRES_DB: panderman
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panderman"]
      interval: 3s
      retries: 20

  # Penangkap email lokal: OTP & notifikasi bisa dilihat di http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
